[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "continuous-collision"
version = "0.1.0"
description = "Certified continuous collision checking for Drake trajectories, on stock pydrake."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Peter Werner", email = "wernrpe@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "drake>=1.51.1"]
keywords = ["drake", "collision checking", "motion planning", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
"Drake PR" = "https://github.com/RobotLocomotion/drake/pull/24924"

[tool.hatch.build.targets.wheel]
packages = ["src/continuous_collision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running property tests (CCD_FULL=1 runs the full corpora)"]
